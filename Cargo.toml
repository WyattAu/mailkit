[package]
name = "mailkit"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Email delivery for Rust — SMTP (lettre) and Resend providers with template rendering, queue, and audit logging"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/mailkit"
keywords = ["email", "smtp", "resend", "template", "queue", "threading"]
categories = ["email", "asynchronous"]
exclude = ["/target"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = "1"
reqwest = { version = "0.12", features = ["json"], optional = true }
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls"], optional = true }
tera = { version = "1", optional = true }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"

[features]
default = ["resend"]
resend = ["dep:reqwest"]
smtp = ["dep:lettre"]
templates = ["dep:tera"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "mailkit_bench"
harness = false
