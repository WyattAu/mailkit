[package]
name = "mailkit"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Email delivery for Rust — SMTP, Resend, AWS SES, SendGrid, and Postmark providers with MIME building, queue, and audit logging"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/mailkit"
keywords = ["email", "smtp", "ses", "sendgrid", "mime"]
categories = ["email", "asynchronous"]
exclude = ["/target"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "fs", "io-util"] }
reqwest = { version = "0.12", features = ["json"], optional = true }
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls"], optional = true }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }

[features]
default = ["resend"]
resend = ["dep:reqwest"]
smtp = ["dep:lettre"]
ses = ["dep:reqwest", "dep:sha2", "dep:hmac"]
sendgrid = ["dep:reqwest"]
postmark = ["dep:reqwest"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
wiremock = "0.6"

[[bench]]
name = "mailkit_bench"
harness = false

[[example]]
name = "resend_email"
required-features = ["resend"]

[[example]]
name = "smtp_email"
required-features = ["smtp"]

[[example]]
name = "ses_email"
required-features = ["ses"]

[[example]]
name = "sendgrid_email"
required-features = ["sendgrid"]

[[example]]
name = "postmark_email"
required-features = ["postmark"]

[[example]]
name = "mime_email"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
